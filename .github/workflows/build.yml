name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: chordloft-test-apk
          path: app/build/outputs/apk/debug/*.apk

      # Runs only after you add the four signing secrets described in README.md.
      - name: Build signed Play Store bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CHORDLOFT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHORDLOFT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHORDLOFT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key set up yet, so only the test APK was built."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CHORDLOFT_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Save Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: chordloft-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
