<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Chordloft</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column — sticky top bar, scrolling content, fixed bottom tabs (or a performance dock on the song sheet). Chords sit in brass above the lyric syllable they land on. */
:root{
  --bg:#EDEFF5; --surface:#FFFFFF; --sunk:#E1E4EF; --ink:#1A1F33; --muted:#586080; --line:#D4D8E6;
  --accent:#2F3C91; --accent-ink:#FFFFFF; --chord:#95560F; --danger:#B3261E;
  --key-white:#FFFFFF; --key-black:#1A1F33;
  --shadow:0 1px 2px rgba(26,31,51,.08),0 4px 16px rgba(26,31,51,.06);
  --font-display:"CL Young Serif","Young Serif", Georgia, "Times New Roman", serif;
  --font-body:"CL Atkinson","Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-chord:"CL DM Mono","DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1120; --surface:#171B2D; --sunk:#20253B; --ink:#E8EAF3; --muted:#9BA2BE; --line:#2A3050;
    --accent:#9AA6FF; --accent-ink:#0E1120; --chord:#E9B558; --danger:#FF8A80;
    --key-white:#D7DAE6; --key-black:#0E1120;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2D; --sunk:#20253B; --ink:#E8EAF3; --muted:#9BA2BE; --line:#2A3050;
  --accent:#9AA6FF; --accent-ink:#0E1120; --chord:#E9B558; --danger:#FF8A80;
  --key-white:#D7DAE6; --key-black:#0E1120;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:60px;padding-block:10px;border-bottom:1px solid var(--line)}
.h1{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.1;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h1.sm{font-size:19px}
.spacer{flex:1}
.push{margin-left:auto}
.push+.push{margin-left:0}
.crow{flex-wrap:nowrap}
.crow .chips{flex-wrap:wrap}
.segc button{padding:6px 9px}
.dstrip{align-items:flex-start}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.wide{width:100%}
.btn.danger{color:var(--danger)}
.btn.danger[data-armed]{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0}
.icon-btn.ghost{border-color:transparent;background:transparent}
.icon-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Segmented control */
.segc{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.segc button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:700}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Lists */
.search{padding-block:14px 4px}
.search input,.field input,.field select,.field textarea,.sel{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;font-size:16px}
.count{color:var(--muted);font-size:13px;margin:8px 0 0;letter-spacing:.04em;text-transform:uppercase}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.keychip{flex:none;display:grid;place-items:center;min-width:46px;height:40px;padding:0 6px;border-radius:9px;background:var(--sunk);font-family:var(--font-chord);font-weight:500;color:var(--chord);font-size:15px}
.rowtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{flex:none;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;line-height:1.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.setcard{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.setcard .when{color:var(--muted);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.setcard .nm{font-family:var(--font-display);font-size:21px}
.keyrun{display:flex;flex-wrap:wrap;gap:6px}
.keyrun span{font-family:var(--font-chord);font-size:12px;color:var(--chord);background:var(--sunk);border-radius:6px;padding:2px 7px}
.empty{color:var(--muted);text-align:center;padding:40px 8px}

/* Song header + controls */
.songhead{padding-block:18px 10px}
.songhead h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
.songhead .by{color:var(--muted);font-size:14px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:700}
.controls{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.crow{display:flex;align-items:center;gap:10px}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tp{display:inline-flex;align-items:center;gap:6px}
.tp .k{min-width:52px;text-align:center;font-family:var(--font-chord);font-weight:500;font-size:20px;color:var(--chord)}
.capo{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.chip b{font-family:var(--font-chord);color:var(--chord);font-weight:500}
.shapenote{font-size:13px;color:var(--muted)}
.shapenote b{font-family:var(--font-chord);color:var(--chord);font-weight:500}

/* Diagrams */
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.dstrip{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:thin}
.dcard{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.dname{font-family:var(--font-chord);font-weight:500;color:var(--chord);font-size:15px}
.dsub{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.dg-str,.dg-fret{stroke:var(--muted);stroke-width:1}
.dg-nut{stroke:var(--ink);stroke-width:3}
.dg-dot{fill:var(--ink)}
.dg-open{fill:none;stroke:var(--ink);stroke-width:1.3}
.dg-txt{fill:var(--muted);font-family:var(--font-chord);font-size:9px}
.pk-w{fill:var(--key-white);stroke:var(--line)}
.pk-b{fill:var(--key-black)}
.pk-on{fill:var(--chord);stroke:var(--chord)}

/* Sheet */
.sheet{font-size:var(--fs,18px);padding-block:10px 32px}
.sec{display:flex;align-items:center;gap:10px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:1.4em 0 .3em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:.4em}
.ln{line-height:1.2;margin:.18em 0}
.w{display:inline-flex;white-space:nowrap;vertical-align:bottom}
.p{display:inline-flex;flex-direction:column;vertical-align:bottom}
.c{font-family:var(--font-chord);font-weight:500;color:var(--chord);font-size:.8em;min-height:1.35em;white-space:pre;padding-right:.5em}
.c:empty{padding-right:0}
.l{white-space:pre}
.ln.plain .c{display:none}
.ln.cl{display:flex;flex-wrap:wrap;gap:.1em 1.4em}
.ln.cl .c{padding-right:0;font-size:.9em}
.gap{height:.6em}
.sheet.nochords .c,.sheet.nochords .ln.cl{display:none}
.src{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:24px}

/* Dock + tabs */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:560px;margin:0 auto;padding:8px 16px}
.tabs .bar-in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;padding:6px 0;border-radius:10px}
.tab[aria-current="page"]{color:var(--accent);background:var(--sunk)}
.dock-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.grp{display:flex;align-items:center;gap:4px}
.spd{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.metro{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.metro[aria-pressed="true"]{border-color:var(--accent)}
.dots{display:inline-flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .05s}
.dot.on{background:var(--accent)}
.dot.on.acc{background:var(--chord)}
.nextsong{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;margin-top:8px}
.nextsong .nm{font-family:var(--font-display);font-size:22px}
.nextsong .nk{display:flex;align-items:center;gap:6px;color:var(--chord);font-family:var(--font-chord);font-size:14px}
.setnav{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.setnav .mid{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);line-height:1.25}
.setnav .mid b{color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* Stage mode */
body.stage .topbar,body.stage .controls,body.stage .dblock,body.stage .facts,body.stage .songhead .by,body.stage .src{display:none}
body.stage .songhead{padding-top:14px}
body.stage .songhead h2{font-size:22px}
.exitstage{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:40}
body:not(.stage) .exitstage{display:none}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field textarea{min-height:320px;font-family:var(--font-chord);font-size:14px;line-height:1.55;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.help{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.help code{font-family:var(--font-chord);color:var(--chord);font-size:13px}
.setitems{list-style:none;margin:0;padding:0}
.si{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.si .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.si .t{flex:1;min-width:0}
.si .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .t small{color:var(--muted)}
.si select{min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-chord);color:var(--chord);padding:0 4px}
.si .icon-btn{width:34px;height:34px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow select{flex:1;min-width:0}

/* Tools */
.bpm{font-family:var(--font-display);font-size:64px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bpm small{display:block;font-family:var(--font-body);font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.bigdots{display:flex;justify-content:center;gap:10px;margin:16px 0}
.bigdots .dot{width:16px;height:16px}
.center{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.h3{font-family:var(--font-display);font-weight:400;font-size:21px;margin:0 0 10px}
.finder{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:50;font-weight:700}
.blk{break-inside:avoid;padding-bottom:.4em}
.blk>.sec{margin-top:1em}
.blk:first-child>.sec{margin-top:.4em}
.wideonly{display:none}
.top-grid{display:block}
@media (min-width:760px){
  body.songview .app,body.songview .bar-in{max-width:1180px}
  body.songview .top-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:end}
  body.songview .songhead{padding-bottom:0}
  .wideonly{display:inline-flex}
  .cols2 .sheet{column-count:2;column-gap:56px;column-rule:1px solid var(--line)}
}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:16px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fchip{border:0;background:var(--sunk);color:var(--ink);font-family:var(--font-chord);font-weight:500;font-size:14px;min-width:34px;height:30px;padding:0 8px;border-radius:7px}
.fchip sup{color:var(--chord);font-size:10px;margin-left:1px}
.fsep{color:var(--muted);font-size:13px}
.fedit{margin-left:auto;min-height:30px;padding:0 8px;font-size:13px}
.arred{margin-top:16px}
.arrlist{list-style:none;margin:10px 0 0;padding:0}
.arrlist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.arrlist .keychip{min-width:40px;height:32px;font-size:14px}
.arrlist .t{flex:1;min-width:0}
.arrlist .icon-btn{width:34px;height:34px}
.chip.addsec{border-style:solid;color:var(--ink)}
.blk{scroll-margin-top:84px}
body.stage .fedit{display:none}
.drop{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border-style:dashed;border-width:2px}
.drop.over{border-color:var(--accent);background:var(--sunk)}
.drop p{margin:0;color:var(--muted);font-size:15px}
.pend{list-style:none;margin:0;padding:0}
.pi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.pi input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.pi .t{flex:1;min-width:0}
.pi .t b{display:block;font-size:16px}
.pi .t .m{font-size:13px;color:var(--muted)}
.pi .t .pv{font-size:14px;margin-top:4px;color:var(--ink);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .warn{font-size:13px;color:var(--chord)}
.pi.err .t .m{color:var(--danger)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#paste{min-height:180px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .f-key{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
</div>
<nav class="bar tabs" id="tabs" aria-label="Sections"><div class="bar-in">
  <button class="tab" data-a="tab" data-v="songs"><svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Songs</button>
  <button class="tab" data-a="tab" data-v="setlists"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Setlists</button>
  <button class="tab" data-a="tab" data-v="tools"><svg class="i" viewBox="0 0 24 24"><path d="M8 21h8l-2-17h-4z"/><path d="M12 14l5-7"/></svg>Tools</button>
</div></nav>
<div id="dock"></div>
<button class="icon-btn exitstage" data-a="stage" aria-label="Exit stage mode"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
<div id="toastwrap"></div>

<script>
/* ---------- Music theory ---------- */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const KEYS_MAJ=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const KEYS_MIN=['Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m','Am','Bbm','Bm'];
const CH_RE=/^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/;
function keyInfo(k){const m=String(k||'').match(/^([A-G][#b]?)(m?)$/);return m?{root:IDX[m[1]],minor:!!m[2]}:{root:0,minor:false}}
function keyName(root,minor){root=((root%12)+12)%12;return minor?KEYS_MIN[root]:KEYS_MAJ[root]}
function transposeKey(k,n){const {root,minor}=keyInfo(k);return keyName(root+n,minor)}
function prefersFlats(k){return /^[A-G]b/.test(k)||['F','Dm','Gm','Cm','Fm'].includes(k)}
function noteName(i,flats){i=((i%12)+12)%12;return (flats?FLAT:SHARP)[i]}
function transposeChord(ch,n,flats){const m=ch.match(CH_RE);if(!m)return ch;return noteName(IDX[m[1]]+n,flats)+m[2]+(m[3]?'/'+noteName(IDX[m[3]]+n,flats):'')}
const DEG=['1','b2','2','b3','3','4','#4','5','b6','6','b7','7'];
function toNumber(ch,keyRoot){const m=ch.match(CH_RE);if(!m)return ch;const d=i=>DEG[((i-keyRoot)%12+12)%12];return d(IDX[m[1]])+m[2]+(m[3]?'/'+d(IDX[m[3]]):'')}
function semis(a,b){let d=((keyInfo(a).root-keyInfo(b).root)%12+12)%12;return d>6?d-12:d}
const QMAP={'2':'sus2','sus':'sus4','add2':'add9','M7':'maj7','Maj7':'maj7','ma7':'maj7','min':'m','-':'m','+':'aug','°':'dim','ø':'m7b5','min7':'m7','-7':'m7'};
function normQ(q){q=(q||'').trim();return QMAP[q]??q}

/* ---------- Parse & render sheet ---------- */
function parseBody(body){
  const out=[];
  for(const raw of String(body||'').split(/\r?\n/)){
    const line=raw.replace(/\s+$/,'');let m;
    if((m=line.match(/^\{\s*(c|comment|ci|cb)\s*:\s*(.*?)\s*\}$/i))){out.push({t:'sec',text:m[2]});continue}
    if((m=line.match(/^\{\s*(?:start_of_(\w+)|so([cvbt]))\s*(?::\s*(.*?))?\s*\}$/i))){const w={c:'Chorus',v:'Verse',b:'Bridge',t:'Tab'}[(m[2]||'').toLowerCase()]||cap(m[1]||'');if(m[3]||w)out.push({t:'sec',text:m[3]||w});continue}
    if((m=line.match(/^\{\s*chorus\s*(?::\s*(.*?))?\s*\}$/i))){out.push({t:'ref',text:m[1]||'Chorus'});continue}

    const segs=[],re=/\[([^\]]+)\]/g;let last=0,cur={chord:null,text:''};

    cur.text+=line.slice(last);segs.push(cur);
    const hasText=segs.some(s=>s.text.trim()),hasChord=segs.some(s=>s.chord);
    out.push({t:hasText?'line':'chords',segs,hasChord});
  }

}
function sheetHTML(parsed,fmt,mode){

    if(b.t==='sec')h+=`</div><div class="blk"${b.id?` id="${b.id}"`:''}>${b.text?`<div class="sec">${esc(b.text)}</div>`:''}`;
    else if(b.t==='gap')h+='<div class="gap"></div>';
    else if(b.t==='chords'){if(mode!=='lyrics')h+=`<div class="ln cl">${b.segs.filter(s=>s.chord).map(s=>`<span class="c">${esc(fmt(s.chord))}</span>`).join('')}</div>`}
    else{
      const words=[];let w='',open=false;

        const pieces=s.text.split(/(?<=\s)/);
        pieces.forEach((pc,i)=>{const ch=i===0&&s.chord?fmt(s.chord):'';
          if(!open){w='';open=true}
          w+=`<span class="p"><span class="c">${esc(ch)}</span><span class="l">${pc?esc(pc):'&nbsp;'}</span></span>`;
          if(!pc||/\s$/.test(pc)){words.push(w);open=false}});

}

function resolveArr(text,defs){
  const raw=String(text||'').trim();if(!raw)return {arr:null,bad:[]};
  const toks=(raw.includes(',')?raw.split(','):raw.split(/\s+/)).map(t=>t.trim()).filter(Boolean).reduce((o,t)=>{if(/^[x×]\s*\d+$|^\(\d+x\)$/i.test(t)&&o.length)o[o.length-1]+=' '+t;else o.push(t);return o},[]);
  const arr=[],bad=[],labels=[...defs.values()].map(d=>d.label).filter(Boolean);
  for(let t of toks){let n=1;const rm=t.match(/^(.*?)\s*(?:[x×]\s*(\d+)|\((\d+)x\))$/i);if(rm&&rm[1]){t=rm[1];n=+(rm[2]||rm[3])}
    const hit=labels.find(l=>l.toLowerCase()===t.toLowerCase())||labels.find(l=>secCode(l).toLowerCase()===t.toLowerCase());
    if(hit)for(let k=0;k<Math.min(n,8);k++)arr.push(hit);else bad.push(t)}
  return {arr:arr.length?arr:null,bad};
}

/* ---------- Metronome ---------- */
const Metro={ctx:null,timer:null,beat:0,bpm:72,beats:4,on:false,taps:[],
  start(){try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.ctx.resume()}catch(e){}
    this.on=true;this.beat=0;clearInterval(this.timer);this.tick();this.timer=setInterval(()=>this.tick(),60000/this.bpm);this.ui()},
  stop(){this.on=false;clearInterval(this.timer);document.querySelectorAll('[data-dot]').forEach(d=>d.className='dot');this.ui()},
  set(b){this.bpm=Math.max(30,Math.min(240,Math.round(b)));if(this.on)this.start();const t=document.getElementById('tBpm');if(t)t.firstChild.nodeValue=this.bpm},
  tick(){const k=this.beat%this.beats,acc=k===0;
    if(this.ctx){try{const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+.07)}catch(e){}}

  if(plainLyric(lines[i])){meta.title=lines[i].trim();i++;

    if(plainLyric(lines[i])&&lines[i].trim().length<70&&(nx===undefined||!nx.trim()||isChordLine(nx)||SEC_RE.test(nx)||META_RE.test(nx))){meta.author=lines[i].trim().replace(/^(words\s*(and|&)\s*music\s*)?by\s+/i,'');i++}}

function readSongs(text,src){

  setName:el=>{setl(nav.sid).name=el.value;persist();const h=document.querySelector('.topbar .h1');if(h)h.textContent=el.value},
  setDate:el=>{setl(nav.sid).date=el.value;persist()},
  itemKey:el=>{setl(nav.sid).items[+el.dataset.i].key=el.value;persist()},
  capo:el=>{sp(nav.id).capo=+el.value;persist();render()},
  pinc:el=>{pending[+el.dataset.i].include=el.checked;const b=document.querySelector('[data-a="doImport"]');const n=pending.filter(p=>p.include&&!p.error).length;if(b){b.textContent=`Import ${n} song${n===1?'':'s'}`;b.disabled=!n}},
  finder:el=>{document.getElementById('finderOut').innerHTML=finderHTML(el.value)}
};
document.addEventListener('input',e=>{const f=IN[e.target.dataset?.in];if(f)f(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('stage')){exitStage();render()}});
/* ---------- Android app hooks ---------- */
window.chordloftBack=function(){
  if(document.body.classList.contains('stage')){exitStage();render();return true}
  if(nav.arrEdit){nav.arrEdit=false;render();return true}
  switch(nav.view){
    case 'song':if(nav.set){go('set',{sid:nav.set.id,set:null})}else go('songs',{set:null});return true;
    case 'edit':go(nav.id?'song':'songs',{});return true;
    case 'set':go('setlists',{});return true;
    case 'import':case 'setlists':case 'tools':go('songs',{set:null});return true;
    case 'songs':if(nav.q){nav.q='';render();return true}return false;
  }
  return false;
};
window.chordloftReceive=function(items){
  (items||[]).forEach(it=>{const got=readSongs(it.text,it.name||'Shared');if(!got.length)pending.push({id:uid(),src:it.name||'Shared',error:'Nothing to import in this file.'});pending.push(...got)});
  go('import',{});
};
window.chordloftPause=function(){Scroll.stop();if(Metro.on)Metro.stop()};
render();
</script>

</body>
</html>
